name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Parser self-test
        run: |
          mkdir -p out
          javac -d out app/src/main/java/app/gridprefs/core/*.java tools/SelfTest.java
          java -cp out SelfTest samples/preferences_ULTRA
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: GridPrefsEditor-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
